<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B87FF"/><stop offset=".5" stop-color="#F472B6"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B87FF" stop-opacity=".9"/><stop offset="1" stop-color="#2DD4BF" stop-opacity=".5"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
</defs>
<style>
  .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  .pl{transform-box:fill-box;transform-origin:center;animation:pl 3s ease-out infinite}
  @keyframes pl{0%{transform:scale(1);opacity:.8}70%,100%{transform:scale(1.6);opacity:0}}
  .fl{animation:fl 1.2s linear infinite} @keyframes fl{to{stroke-dashoffset:-24}}
</style>
<rect width="1200" height="270" rx="22" fill="#0B0B14"/>
<rect width="1200" height="270" rx="22" fill="url(#grid)"/>
<rect x=".5" y=".5" width="1199" height="269" rx="22" fill="none" stroke="url(#edge)" stroke-opacity=".4"/>
<text x="600" y="50" text-anchor="middle" class="s" font-size="22" font-weight="800" fill="url(#g)">Got an idea? Let's take it all the way.</text>
<path id="p" d="M150 128 H1050" fill="none" stroke="#26263A" stroke-width="3"/>
<path d="M150 128 H1050" fill="none" stroke="url(#edge)" stroke-width="3" stroke-dasharray="8 16" class="fl"/>
<circle r="7" fill="#E6E6F0"><animateMotion dur="4s" repeatCount="indefinite" path="M150 128 H1050"/></circle>
<circle r="14" fill="#8B87FF" opacity=".35"><animateMotion dur="4s" repeatCount="indefinite" path="M150 128 H1050"/></circle>
<g>
  <circle cx="150" cy="128" r="34" fill="#12121F" stroke="#8B87FF" stroke-width="2"/>
  <circle cx="150" cy="128" r="34" fill="none" stroke="#8B87FF" stroke-opacity=".5" class="pl" style="animation-delay:0.0s"/>
  <text x="150" y="134" text-anchor="middle" class="m" font-size="17" font-weight="700" fill="#8B87FF">01</text>
  <text x="150" y="194" text-anchor="middle" class="s" font-size="17" font-weight="800" letter-spacing="3" fill="#E6E6F0">IDEA</text>
  <text x="150" y="218" text-anchor="middle" class="s" font-size="14" fill="#9A9AB5">you bring a problem</text>
</g>
<g>
  <circle cx="450" cy="128" r="34" fill="#12121F" stroke="#F472B6" stroke-width="2"/>
  <circle cx="450" cy="128" r="34" fill="none" stroke="#F472B6" stroke-opacity=".5" class="pl" style="animation-delay:0.75s"/>
  <text x="450" y="134" text-anchor="middle" class="m" font-size="17" font-weight="700" fill="#F472B6">02</text>
  <text x="450" y="194" text-anchor="middle" class="s" font-size="17" font-weight="800" letter-spacing="3" fill="#E6E6F0">BUILD</text>
  <text x="450" y="218" text-anchor="middle" class="s" font-size="14" fill="#9A9AB5">scope it, prototype it</text>
</g>
<g>
  <circle cx="750" cy="128" r="34" fill="#12121F" stroke="#2DD4BF" stroke-width="2"/>
  <circle cx="750" cy="128" r="34" fill="none" stroke="#2DD4BF" stroke-opacity=".5" class="pl" style="animation-delay:1.5s"/>
  <text x="750" y="134" text-anchor="middle" class="m" font-size="17" font-weight="700" fill="#2DD4BF">03</text>
  <text x="750" y="194" text-anchor="middle" class="s" font-size="17" font-weight="800" letter-spacing="3" fill="#E6E6F0">SHIP</text>
  <text x="750" y="218" text-anchor="middle" class="s" font-size="14" fill="#9A9AB5">tests, CI, production</text>
</g>
<g>
  <circle cx="1050" cy="128" r="34" fill="#12121F" stroke="#FBBF24" stroke-width="2"/>
  <circle cx="1050" cy="128" r="34" fill="none" stroke="#FBBF24" stroke-opacity=".5" class="pl" style="animation-delay:2.25s"/>
  <text x="1050" y="134" text-anchor="middle" class="m" font-size="17" font-weight="700" fill="#FBBF24">04</text>
  <text x="1050" y="194" text-anchor="middle" class="s" font-size="17" font-weight="800" letter-spacing="3" fill="#E6E6F0">DISTRIBUTE</text>
  <text x="1050" y="218" text-anchor="middle" class="s" font-size="14" fill="#9A9AB5">npm, stores, real users</text>
</g>
<text x="600" y="252" text-anchor="middle" class="m" font-size="13" fill="#9A9AB5">open to collaborations · freelance · ideas worth building</text>
</svg>
