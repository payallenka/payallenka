  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B87FF" stop-opacity=".9"/><stop offset="1" stop-color="#2DD4BF" stop-opacity=".5"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
</defs>
<style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace} .l{opacity:0;animation:in .4s ease forwards} @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}</style>
<rect width="1200" height="348" rx="16" fill="#12121F"/>
<rect width="1200" height="348" rx="16" fill="url(#grid)"/>
<rect x=".5" y=".5" width="1199" height="347" rx="16" fill="none" stroke="url(#edge)" stroke-opacity=".45"/>
<circle cx="28" cy="26" r="6" fill="#FF5F57"/><circle cx="48" cy="26" r="6" fill="#FEBC2E"/><circle cx="68" cy="26" r="6" fill="#28C840"/>
<text x="40" y="64" class="m" font-size="14"><tspan fill="#8B87FF">$</tspan><tspan fill="#E6E6F0"> git log --author=payallenka --merged --upstream</tspan></text>
<line x1="58" y1="92" x2="58" y2="322" stroke="#26263A" stroke-width="2"/>
