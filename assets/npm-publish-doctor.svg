<style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace} .gl{animation:gl 4s ease-in-out infinite alternate} @keyframes gl{from{opacity:.25}to{opacity:.7}}</style>
